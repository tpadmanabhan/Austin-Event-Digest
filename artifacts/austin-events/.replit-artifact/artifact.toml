kind = "web"
previewPath = "/"
title = "Raj's Austin Events"
version = "1.0.0"
id = "artifacts/austin-events"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23822

[services.development]
run = "pnpm --filter @workspace/austin-events run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/austin-events", "run", "build" ]
publicDir = "artifacts/austin-events/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23822"
BASE_PATH = "/"
