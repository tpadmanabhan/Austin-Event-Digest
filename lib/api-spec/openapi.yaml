openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Raj's Austin Events newsletter
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsletter
    description: Newsletter subscriber and digest operations
  - name: events
    description: Events and digest management
  - name: tenants
    description: Multi-tenant platform operations
  - name: gamification
    description: Superconnector XP, badges, challenges, streaks and leaderboard
paths:
  /city-requests:
    post:
      operationId: submitCityRequest
      tags: [tenants]
      summary: Save a city request for manual review on the platform root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityRequestInput"
      responses:
        "201":
          description: Saved; notificationStatus separately reports provider acceptance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityRequestReceipt"
        "200":
          description: Already saved; duplicate submissions never resend email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityRequestReceipt"
        "400":
          description: Invalid city or email
        "403":
          description: Platform root only
        "429":
          description: Request limit reached
        "503":
          description: Request could not be saved
  /events/public/{eventId}/metadata:
    get:
      operationId: getPublicEventMetadata
      tags: [events]
      summary: Read source-verified metadata for a publicly visible event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified fields only; empty metadata when the source cannot be verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      startDate:
                        type: string
                      timezone:
                        type: string
                      venueAddress:
                        type: string
                required: [metadata]
        "404":
          description: Event is not publicly visible in this city
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /newsletter/subscribe:
    post:
      operationId: subscribeToNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: Successfully subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/unsubscribe:
    post:
      operationId: unsubscribeFromNewsletter
      tags: [newsletter]
      summary: Unsubscribe from the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeRequest"
      responses:
        "200":
          description: Successfully unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /newsletter/subscribers:
    get:
      operationId: getSubscribers
      tags: [newsletter]
      summary: Get all subscribers (admin)
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribersResponse"

  /events/digest/latest:
    get:
      operationId: getLatestDigest
      tags: [events]
      summary: Get the latest weekly digest
      responses:
        "200":
          description: Latest digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResponse"
        "404":
          description: No digest found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/digest/list:
    get:
      operationId: listDigests
      tags: [events]
      summary: List all past digests
      responses:
        "200":
          description: List of digests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestListResponse"

  /events/leadership-managed:
    get:
      operationId: listLeadershipManagedEvents
      tags: [events]
      summary: Get active upcoming Leadership Austin events
      responses:
        "200":
          description: Active upcoming events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipManagedEventsResponse"
    post:
      operationId: createLeadershipManagedEvent
      tags: [events]
      summary: Add a persistent Leadership Austin event (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipManagedEventInput"
      responses:
        "201":
          description: Event added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipManagedEventResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rsvp/managed:
    get:
      operationId: getLeadershipEventRsvpCount
      tags: [events]
      summary: Get interest count for a persistent Leadership Austin event
      parameters:
        - name: managedEventId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interest count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedEventRsvpCount"
    post:
      operationId: createLeadershipEventRsvp
      tags: [events]
      summary: Record interest in a persistent Leadership Austin event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedEventRsvpRequest"
      responses:
        "200":
          description: Interest recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedEventRsvpResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid signed email link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/leadership-managed/admin:
    get:
      operationId: listAllLeadershipManagedEvents
      tags: [events]
      summary: Get all persistent Leadership Austin events (admin)
      responses:
        "200":
          description: All persistent events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipManagedEventsResponse"

  /events/leadership-event-contributions/access:
    post:
      operationId: requestLeadershipEventContributionAccess
      tags: [events]
      summary: Email a contributor access link to an active Leadership Austin subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipEventContributionAccessInput"
      responses:
        "200":
          description: Generic response that does not reveal whether an address is subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipEventContributionAccessResponse"
        "400":
          description: Invalid email or CAPTCHA
        "429":
          description: Request limit reached

  /events/leadership-event-contributions/session:
    get:
      operationId: getLeadershipEventContributionSession
      tags: [events]
      summary: Check the verified subscriber session for event contributions
      responses:
        "200":
          description: Current contributor session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipEventContributionSession"

  /events/leadership-event-contributions/verify:
    get:
      operationId: verifyLeadershipEventContributionAccess
      tags: [events]
      summary: Verify a subscriber email link and open the contribution form
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Sets an HttpOnly contributor session cookie and redirects to the form
        "400":
          description: Invalid or expired verification link

  /events/leadership-event-contributions/parse:
    post:
      operationId: parseLeadershipEventContributionUrl
      tags: [events]
      summary: Auto-fill event fields from a verified subscriber's public event link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipEventContributionParseInput"
      responses:
        "200":
          description: Parsed event details for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipEventContributionParseResponse"
        "400":
          description: Invalid or unsupported event URL
        "401":
          description: Subscriber email verification required

  /events/leadership-event-contributions:
    post:
      operationId: submitLeadershipEventContribution
      tags: [events]
      summary: Submit a Leadership Austin event for admin review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipEventContributionInput"
      responses:
        "201":
          description: Event received and held for admin approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipEventContributionResponse"
        "400":
          description: Invalid event details
        "401":
          description: Subscriber email verification required
        "409":
          description: Event is already in the Leadership Austin list

  /events/leadership-event-contributions/pending:
    get:
      operationId: listPendingLeadershipEventContributions
      tags: [events]
      summary: List subscriber event submissions awaiting admin review
      responses:
        "200":
          description: Pending submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipEventContributionPendingResponse"
        "403":
          description: Admin access required

  /events/leadership-event-contributions/{id}/review:
    patch:
      operationId: reviewLeadershipEventContribution
      tags: [events]
      summary: Approve or reject a subscriber event submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipEventContributionReviewInput"
      responses:
        "200":
          description: Submission reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipEventContributionReviewResponse"
        "400":
          description: Invalid review decision
        "404":
          description: Pending submission not found

  /events/leadership-managed/{id}:
    patch:
      operationId: updateLeadershipManagedEvent
      tags: [events]
      summary: Update a persistent managed community event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadershipManagedEventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipManagedEventResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: archiveLeadershipManagedEvent
      tags: [events]
      summary: Archive a persistent Leadership Austin event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadershipManagedEventResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/digest/generate:
    post:
      operationId: generateDigest
      tags: [events]
      summary: Generate a new weekly digest (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDigestRequest"
      responses:
        "200":
          description: Digest generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestResponse"

  /events/digest/send:
    post:
      operationId: sendDigest
      tags: [events]
      summary: Send the latest digest to all subscribers (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendDigestRequest"
      responses:
        "200":
          description: Digest sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /events/digest/{id}/alumni-happenings:
    post:
      operationId: addAlumniHappening
      tags: [events]
      summary: Add a manually curated Leadership Austin alumni item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlumniHappeningInput"
      responses:
        "200":
          description: Alumni item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlumniHappeningResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Digest not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/config:
    get:
      operationId: getTenantConfig
      tags: [tenants]
      summary: Get public config for a tenant by slug
      parameters:
        - name: slug
          in: query
          required: true
          schema:
            type: string
          description: The tenant's subdomain slug (e.g. "austin")
      responses:
        "200":
          description: Tenant config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigResponse"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenants/list:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all active tenants (for platform homepage)
      responses:
        "200":
          description: List of active tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantsListResponse"

  /gamification/leaderboard:
    get:
      operationId: getGamificationLeaderboard
      tags: [gamification]
      summary: Get leaderboard of all cities ranked by XP (admin)
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gamification/me:
    get:
      operationId: getGamificationMe
      tags: [gamification]
      summary: Get current tenant's XP, rank, badges, challenges, and streak (admin)
      responses:
        "200":
          description: Gamification profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamificationMeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gamification/badges:
    get:
      operationId: getGamificationBadges
      tags: [gamification]
      summary: Get all badge definitions with earned state for current tenant (admin)
      responses:
        "200":
          description: Badges list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/local-events:
    get:
      operationId: getCentinelaLocalEvents
      tags: [events]
      summary: Get a small selection of upcoming public Santa Monica events
      responses:
        "200":
          description: A short, source-linked preview of upcoming local events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaLocalEventsResponse"
        "502":
          description: The source calendar is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/portal:
    get:
      operationId: getCentinelaResidentPortal
      tags: [tenants]
      summary: Get private Centinela resident updates and proposed activities
      responses:
        "200":
          description: Private resident portal content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaResidentPortalResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The signed-in email is not approved for resident access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/activities/{activityId}/interest:
    put:
      operationId: setCentinelaActivityInterest
      tags: [tenants]
      summary: Express or remove interest in a resident activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInterestUpdate"
      responses:
        "200":
          description: Updated interest state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityInterestResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Resident approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/newsletter:
    put:
      operationId: setCentinelaNewsletterSubscription
      tags: [newsletter]
      summary: Opt an approved resident in or out of Centinela email updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionUpdate"
      responses:
        "200":
          description: Newsletter preference saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriptionResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Resident approval required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/admin/residents:
    get:
      operationId: listCentinelaResidents
      tags: [tenants]
      summary: List approved Centinela resident email addresses for the tenant admin
      responses:
        "200":
          description: Approved resident addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaResidentsResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addCentinelaResident
      tags: [tenants]
      summary: Approve a resident email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentinelaResidentInput"
      responses:
        "201":
          description: Resident address approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaResidentResponse"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/admin/residents/{residentId}:
    delete:
      operationId: removeCentinelaResident
      tags: [tenants]
      summary: Revoke resident access
      parameters:
        - name: residentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Resident access revoked
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resident address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/admin/updates:
    get:
      operationId: listCentinelaUpdates
      tags: [tenants]
      summary: List HOA updates for tenant administration
      responses:
        "200":
          description: HOA updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaUpdatesResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCentinelaUpdate
      tags: [tenants]
      summary: Publish a private HOA update to approved residents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentinelaUpdateInput"
      responses:
        "201":
          description: HOA update published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaUpdateResponse"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/admin/updates/{updateId}:
    patch:
      operationId: updateCentinelaUpdate
      tags: [tenants]
      summary: Edit a private HOA update
      parameters:
        - name: updateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentinelaUpdatePatch"
      responses:
        "200":
          description: HOA update saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaUpdateResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Update not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCentinelaUpdate
      tags: [tenants]
      summary: Delete a private HOA update
      parameters:
        - name: updateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Update deleted
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Update not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/admin/activities:
    get:
      operationId: listCentinelaActivities
      tags: [tenants]
      summary: List resident activity proposals for administration
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaActivitiesResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCentinelaActivity
      tags: [tenants]
      summary: Add a resident activity proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentinelaActivityInput"
      responses:
        "201":
          description: Activity proposal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaActivityResponse"
        "400":
          description: Invalid activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /centinela/admin/activities/{activityId}:
    patch:
      operationId: updateCentinelaActivity
      tags: [tenants]
      summary: Edit or update the status of a resident activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentinelaActivityPatch"
      responses:
        "200":
          description: Activity saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentinelaActivityResponse"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCentinelaActivity
      tags: [tenants]
      summary: Delete a resident activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Activity deleted
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CityRequestInput:
      type: object
      additionalProperties: false
      required: [cityName, email]
      properties:
        cityName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
    CityRequestReceipt:
      type: object
      required: [saved, duplicate, notificationStatus]
      properties:
        saved:
          type: boolean
          enum: [true]
        duplicate:
          type: boolean
        notificationStatus:
          type: string
          enum: [sent, failed, unconfirmed]
        acknowledgementStatus:
          type: string
          enum: [not_sent, sent, failed, unconfirmed]
          description: Requester email provider acceptance, tracked separately from the admin notification. Absent on older servers.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SubscribeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
      required:
        - email

    SubscribeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        subscriber:
          $ref: "#/components/schemas/Subscriber"
      required:
        - success
        - message

    UnsubscribeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    MessageResponse:
      type: object
      properties:
        success:
