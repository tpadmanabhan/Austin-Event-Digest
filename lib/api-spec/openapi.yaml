        confirm:
          type: boolean
          description: Must be true to trigger a full subscriber send (safety guard)
        personalizeByLocation:
          type: boolean
          description: When false, sends the same event order to all recipients instead of applying Austin saved-location personalization. Defaults to true.
        testSubjectSuffix:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[^\r\n]*\S[^\r\n]*$'
          description: Optional subject suffix for a one-off test email only
        testAttachment:
