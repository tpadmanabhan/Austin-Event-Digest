          type: string
        timezone:
          type: string
        venueAddress:
          type: string
        title:
          type: string
        date:
          type: string
        venue:
          type: string
        description:
          type: string
        link:
          type: string
          nullable: true
        linkText:
          type: string
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        sourceName:
          type: string
        sourceUrl:
          type: string
          nullable: true
        sourceAlumni:
          type: string
        isPersistentManaged:
          type: boolean
        managedEventId:
          type: integer
        featured:
          type: boolean
        isPost:
          type: boolean
        isBusinessSpotlight:
          type: boolean
