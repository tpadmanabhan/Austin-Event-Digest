      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._ -]{0,159}\.pdf$'
        contentBase64:
          type: string
          minLength: 4
          maxLength: 200000
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
      required:
        - filename
